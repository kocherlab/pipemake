pipeline: annotate-genes-eggnog
version: 1.0
parser:
  help: Annotate genes using eggNOG
  arg-groups:
    basic:
      args:
        aa-transcript-fasta:
          help: "Amino acid transcript file"
          type: str
          required: True
          action: confirmFile
        eggnog-data-dir:
          help: "The eggNOG database directory. If the database is not present, it will be downloaded. Please note: The eggNOG database is large and ideally should be downloaded once and shared across multiple runs of this pipeline."
          type: str
          required: True
          action: externalPath
        assembly-version:
          help: "Assembly Version"
          type: str
          default:
            str: "v"
            suffix:
              - function: jobRandomString
        annotation-version:
          help: "Annotation Version"
          type: str
          default:
            str: ""
            suffix:
              - function: jobRandomString
        species:
          help: "Species name"
          type: str
          default:
            str: "Sp"
            suffix:
              - function: jobRandomString
setup:
  aa_transcript_input:
    methods: 
      file-str: "{aa-transcript-fasta}"
    args:
      standardized_filename: "Annotations/Unprocessed/{species}_{assembly-version}.{annotation-version}_pep.fa"
      copy_method: "copy"
      gzipped: False

snakemake:
  modules:
    - download_eggnog_database
    - annotations_eggnog_mapper